[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "storm-db"
version = "1.0.0"
description = "Natural disaster events database API – hurricanes, earthquakes, droughts, tsunamis"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.29",
    "sqlmodel>=0.0.21",
    "pydantic-settings>=2.3",
    "psycopg2-binary>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/storm_db"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
